openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: eWater Monitor API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ewater
    description: eWater API proxy operations
  - name: notifier
    description: Registration webhook notifier
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /ewater/credentials:
    get:
      operationId: getCredentialsStatus
      tags: [ewater]
      summary: Check if eWater credentials are configured
      responses:
        "200":
          description: Credentials status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsStatus"
    post:
      operationId: saveCredentials
      tags: [ewater]
      summary: Save eWater credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsInput"
      responses:
        "200":
          description: Credentials saved and token obtained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsStatus"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: clearCredentials
      tags: [ewater]
      summary: Clear saved eWater credentials
      responses:
        "200":
          description: Credentials cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsStatus"

  /ewater/assets:
    get:
      operationId: listAssets
      tags: [ewater]
      summary: List all assets (community taps, controllers, etc.)
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}:
    get:
      operationId: getAsset
      tags: [ewater]
      summary: Get asset details
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/telemetry:
    get:
      operationId: fetchAssetTelemetry
      tags: [ewater]
      summary: Get telemetry data for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Telemetry entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TelemetryEntry"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/dashboard:
    get:
      operationId: getDashboard
      tags: [ewater]
      summary: Get system health summary for the dashboard
      parameters:
        - name: lifecycleState
          in: query
          required: false
          schema:
            type: string
            enum: [PreInstallation, Staged, Active]
            default: Active
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/entities:
    get:
      operationId: getEntityHierarchy
      tags: [ewater]
      summary: Get entity hierarchy (countries → water systems)
      responses:
        "200":
          description: Entity hierarchy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityHierarchy"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/tech:
    get:
      operationId: getAssetTech
      tags: [ewater]
      summary: Get comprehensive technical status for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset technical status bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetTechStatus"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/udp-health:
    get:
      operationId: getAssetUdpHealth
      tags: [ewater]
      summary: Get bounded, cached UDP modem health for all known asset IMEIs
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Per-modem UDP health and freshest communications summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetUdpHealth"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/ewc:
    get:
      operationId: getAssetEwc
      tags: [ewater]
      summary: Get EWC calibration settings and calculated price of water for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: EWC settings and price of water
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetEwcSettings"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/esense-charts:
    get:
      operationId: getESenseCharts
      tags: [ewater]
      summary: Get eSense chart data (tank height, daily inflow, voltage) over a time range
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 3
      responses:
        "200":
          description: eSense chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ESenseChartsData"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/meter-reading:
    get:
      operationId: getAssetMeterReading
      tags: [ewater]
      summary: Get the latest tick-accumulator meter reading from HEALTH_STATE packets
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Meter reading result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterReadingResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/packets:
    get:
      operationId: getAssetPackets
      tags: [ewater]
      summary: Get decoded raw NB-IoT packet logs for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 24
            minimum: 1
            maximum: 72
          description: How many hours back to look (1-72, default 24)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          description: Max packets to return (1-100, default 50)
        - name: imei
          in: query
          required: false
          schema:
            type: string
          description: Restrict to a single IMEI. Omit to merge packets across all IMEIs registered for the asset.
      responses:
        "200":
          description: Decoded packet log entries, newest first, merged across all IMEIs for the asset unless `imei` is given. Empty array if asset has no IMEI.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RawPacketLog"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/reset-meter:
    post:
      operationId: resetAssetMeter
      tags: [ewater]
      summary: Reset the tick accumulator to a given litre value via eWater command API
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetMeterBody"
      responses:
        "200":
          description: Reset result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetMeterResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/apply-calibration:
    post:
      operationId: applyAssetCalibration
      tags: [ewater]
      summary: Write the suggested LCF (LitresConversion) and measured Preload settings to the device via the eWater RequestSettingChange API
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyCalibrationBody"
      responses:
        "200":
          description: Per-setting write results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyCalibrationResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/flow-rate:
    get:
      operationId: getAssetFlowRate
      tags: [ewater]
      summary: Get most recent valid flow rate (L/min) from last 24 hours of EWC logs
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Flow rate result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowRateResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/proxy:
    post:
      operationId: proxyRequest
      tags: [ewater]
      summary: Generic proxy to any eWater API endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxyInput"
      responses:
        "200":
          description: Proxied response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifier/settings:
    get:
      operationId: getNotifierSettings
      tags: [notifier]
      summary: Get registration webhook notifier settings and last run status
      responses:
        "200":
          description: Notifier settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifierSettings"

    put:
      operationId: updateNotifierSettings
      tags: [notifier]
      summary: Update registration webhook notifier settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifierSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifierSettings"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifier/test:
    post:
      operationId: testNotifier
      tags: [notifier]
      summary: Run one registration gather-and-send cycle immediately (ignores enabled flag)
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifierTestResult"
        "400":
          description: No webhook URL configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Gather or send failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifierTestResult"

  /ewater/hhc/meters:
    get:
      operationId: listHouseholdMeters
      tags: [ewater]
      summary: List household meters (paginated, filterable)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter by asset lifecycle state (case-insensitive)
        - name: waterSystemId
          in: query
          required: false
          schema:
            type: integer
        - name: waterSystem
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive substring match on water system name
        - name: country
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive exact match on country name
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Substring match on meter name or asset ID
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Paginated household meter list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdMeterListPage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/meters/{assetId}:
    get:
      operationId: getHouseholdMeter
      tags: [ewater]
      summary: Get household meter summary
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Household meter summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdMeterSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not a household meter or not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/meters/{assetId}/state:
    get:
      operationId: getHouseholdMeterState
      tags: [ewater]
      summary: Get authoritative current Shengda state (reducer output) with connectivity and health
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current meter state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdMeterState"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/meters/{assetId}/history:
    get:
      operationId: getHouseholdMeterHistory
      tags: [ewater]
      summary: Get bucketed usage history from cumulative meter readings (reset-aware)
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: ["24h", "7d", "30d", "90d"]
            default: "7d"
      responses:
        "200":
          description: Usage history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdMeterHistory"
        "400":
          description: Invalid period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/meters/{assetId}/communications:
    get:
      operationId: getHouseholdMeterCommunications
      tags: [ewater]
      summary: Get decoded packet log for a household meter (paginated, filterable)
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 72
            minimum: 1
            maximum: 720
        - name: validOnly
          in: query
          required: false
          schema:
            type: boolean
          description: Only CRC-valid packets
        - name: messageFunction
          in: query
          required: false
          schema:
            type: string
          description: Substring filter on message function label
        - name: imei
          in: query
          required: false
          schema:
            type: string
          description: Substring filter on source IMEI
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Paginated decoded packet log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdMeterCommunicationsPage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/meters/{assetId}/commissioning:
    get:
      operationId: getHouseholdMeterCommissioning
      tags: [ewater]
      summary: Get the full commissioning session, three-gate QC checklist, blockers, comms test and RTC drift
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Commissioning detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissioningDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateHouseholdMeterCommissioning
      tags: [ewater]
      summary: Update commissioning session stage, start comms test, set batch size, record a manual QC result, or approve
      description: Requires a Bearer operator token from /ewater/hhc/auth/login; identity and role are taken from the verified token.
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommissioningBody"
      responses:
        "200":
          description: Updated commissioning detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissioningDetail"
        "400":
          description: Invalid body or missing operator identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Approval blocked by failing mandatory checks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/auth/login:
    post:
      operationId: hhcOperatorLogin
      tags: [ewater]
      summary: Exchange an operator access key for a signed operator token (identity and role are server-verified)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorLoginBody"
      responses:
        "200":
          description: Operator session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorSession"
        "401":
          description: Invalid access key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Operator access keys not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/config:
    get:
      operationId: getHhcConfig
      tags: [ewater]
      summary: Read HHC configuration (battery thresholds, Gate 3 sample %, RTC tolerance, tariff)
      responses:
        "200":
          description: HHC configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HhcConfiguration"
    put:
      operationId: updateHhcConfig
      tags: [ewater]
      summary: Update HHC configuration (admin only — requires a Bearer operator token with the admin role)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HhcConfigurationUpdate"
      responses:
        "200":
          description: Updated HHC configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HhcConfiguration"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/meters/{assetId}/parts/modem-iccid:
    post:
      operationId: recordModemIccid
      tags: [ewater]
      summary: Record/verify a modem ICCID during commissioning (syncs the Pulse parts inventory)
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModemIccidBody"
      responses:
        "200":
          description: ICCID recorded in Pulse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModemIccidResult"
        "400":
          description: Invalid body or missing operator identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Pulse API rejected the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/parts/job-types:
    get:
      operationId: getHhcJobTypes
      tags: [ewater]
      summary: List Pulse job types (thin proxy to Pulse GET /api/jobs/JobTypes)
      responses:
        "200":
          description: Job types
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobTypesResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Pulse API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/alarms:
    get:
      operationId: getHhcFleetAlarms
      tags: [ewater]
      summary: Fleet-wide alarm view combining Pulse faults and Shengda-derived health alarms
      responses:
        "200":
          description: Fleet alarms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HhcFleetAlarms"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/meters/{assetId}/alarms:
    get:
      operationId: getHhcMeterAlarms
      tags: [ewater]
      summary: Per-meter alarms merged from Pulse faults and Shengda health evaluation
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Meter alarms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HhcMeterAlarms"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/meters/{assetId}/maintenance:
    get:
      operationId: getHhcMeterMaintenance
      tags: [ewater]
      summary: List Pulse maintenance jobs linked to this asset (Pulse is the source of truth)
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pulse jobs for the asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceJobsResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Pulse API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createHhcMaintenanceJob
      tags: [ewater]
      summary: Create a Pulse maintenance job for this asset (requires operator token; audited locally)
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMaintenanceJobBody"
      responses:
        "200":
          description: Created Pulse job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceJobResult"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Pulse API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/meters/{assetId}/maintenance/{jobId}/reassign:
    put:
      operationId: reassignHhcMaintenanceJob
      tags: [ewater]
      summary: Reassign a Pulse job to another technician (requires operator token; audited locally)
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignJobBody"
      responses:
        "200":
          description: Reassigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceActionResult"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Pulse API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/meters/{assetId}/maintenance/{jobId}:
    delete:
      operationId: cancelHhcMaintenanceJob
      tags: [ewater]
      summary: Cancel a Pulse job (requires operator token; audited locally)
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelJobBody"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceActionResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Pulse API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/meters/{assetId}/maintenance/{jobId}/events:
    post:
      operationId: recordHhcMaintenanceJobEvents
      tags: [ewater]
      summary: Record job lifecycle events against a Pulse job (requires operator token; audited locally)
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordJobEventsBody"
      responses:
        "200":
          description: Events recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceActionResult"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Pulse API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/users:
    get:
      operationId: getHhcAssignableUsers
      tags: [ewater]
      summary: List Pulse assignable users for the technician assignment dropdown
      responses:
        "200":
          description: Assignable users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignableUsersResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Pulse API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/fault-types:
    get:
      operationId: getHhcFaultTypes
      tags: [ewater]
      summary: List Pulse fault types
      responses:
        "200":
          description: Fault types
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PulseFaultTypesResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Pulse API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/job-types:
    get:
      operationId: getHhcManualJobTypes
      tags: [ewater]
      summary: List Pulse job types available for manual creation against assets
      responses:
        "200":
          description: Manual-create job types
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PulseJobTypesResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Pulse API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/meters/{assetId}/audit:
    get:
      operationId: getHhcMeterAudit
      tags: [ewater]
      summary: Local action audit trail for this asset (requires a Bearer operator token)
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Audit entries, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HhcActionAuditPage"
        "401":
          description: Missing or invalid operator token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ResetMeterBody:
      type: object
      required: [litres]
      properties:
        litres:
          type: number
          description: Target accumulated meter reading in litres (litreValue)

    ResetMeterResult:
      type: object
      required: [litres, success]
      properties:
        litres:
          type: number
          description: Litre value sent to the device
        success:
          type: boolean
        error:
          type: string
          nullable: true

    ApplyCalibrationBody:
      type: object
      required: [lcf, preload]
      properties:
        lcf:
          type: integer
          minimum: 1
          description: LCF (LitresConversion, ticks per litre) to write
        preload:
          type: integer
          minimum: 0
          description: Preload (unmetered tick offset) to write — the measured preload rounded to an integer, 0 when none was measured

    ApplyCalibrationSettingResult:
      type: object
      required: [settingKey, success]
      properties:
        settingKey:
          type: string
          description: eWater setting key written (LitresConversion or Preload)
        success:
          type: boolean
        error:
          type: string
          nullable: true

    ApplyCalibrationResult:
      type: object
      required: [success, results]
      properties:
        success:
          type: boolean
          description: True only if every setting change was accepted
        results:
          type: array
          items:
            $ref: "#/components/schemas/ApplyCalibrationSettingResult"

    MeterReadingResult:
      type: object
      required: [found]
      properties:
        ticks:
          type: number
          nullable: true
          description: Raw ECR tick accumulator from latest HEALTH_STATE packet
        lcf:
          type: number
          nullable: true
          description: Ticks per litre (LCF) from the packet
        litres:
          type: number
          nullable: true
          description: Computed litres (ticks / LCF)
        timestamp:
          type: string
          nullable: true
          description: ISO timestamp of the HEALTH_STATE packet
        found:
          type: boolean
          description: False when no HEALTH_STATE packet found in last 14 days

    FlowRateResult:
      type: object
      required: [timedOut]
      properties:
        flowRate:
          type: number
          nullable: true
          description: Most recent flow rate in L/min (null if none found)
        timestamp:
          type: string
          nullable: true
          description: ISO timestamp of the most recent valid dispense event
        timedOut:
          type: boolean
          description: True when no valid dispense event found in the last 24 hours

    CredentialsInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    CredentialsStatus:
      type: object
      required: [isConfigured]
      properties:
        isConfigured:
          type: boolean
        environment:
          type: ["string", "null"]
        tokenExpiresAt:
          type: ["string", "null"]

    Asset:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
        isOnline:
          type: ["boolean", "null"]
        location:
          type: ["string", "null"]
        lastSeen:
          type: ["string", "null"]
        batteryVoltage:
          type: ["number", "null"]
        signalStrength:
          type: ["number", "null"]
        hasPowerFault:
          type: ["boolean", "null"]
        hasFlowFault:
          type: ["boolean", "null"]
        parentId:
          type: ["integer", "null"]
        waterSystemName:
          type: ["string", "null"]
        countryName:
          type: ["string", "null"]
        rawData:
          type: object
          additionalProperties: true

    TelemetryEntry:
      type: object
      required: [id, assetId, timestamp]
      properties:
        id:
          type: string
        assetId:
          type: string
        timestamp:
          type: string
        imei:
          type: ["string", "null"]
        correlationId:
          type: ["string", "null"]
        pipeline:
          type: ["string", "null"]
        payload:
          type: ["string", "null"]
        rawData:
          type: object
          additionalProperties: true

    DashboardSummary:
      type: object
      required: [totalAssets, onlineCount, offlineCount, faultCount, lifecycleFilter]
      properties:
        totalAssets:
          type: integer
        onlineCount:
          type: integer
        offlineCount:
          type: integer
        faultCount:
          type: integer
        powerFaultCount:
          type: integer
        flowFaultCount:
          type: integer
        lastUpdated:
          type: ["string", "null"]
        lifecycleFilter:
          type: string
        recentAlerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"

    Alert:
      type: object
      required: [id, assetId, message, severity]
      properties:
        id:
          type: string
        assetId:
          type: string
        assetName:
          type: ["string", "null"]
        message:
          type: string
        severity:
          type: string
        timestamp:
          type: string

    EntityWaterSystem:
      type: object
      required: [id, name, assetCount]
      properties:
        id:
          type: integer
        name:
          type: string
        assetCount:
          type: integer

    EntityCountry:
      type: object
      required: [id, name, waterSystems]
      properties:
        id:
          type: integer
        name:
          type: string
        waterSystems:
          type: array
          items:
            $ref: "#/components/schemas/EntityWaterSystem"

    EntityHierarchy:
      type: object
      required: [countries]
      properties:
        countries:
          type: array
          items:
            $ref: "#/components/schemas/EntityCountry"

    FirmwareDevice:
      type: object
      required: [deviceType]
      properties:
        deviceType:
          type: string
        version:
          type: ["string", "null"]
        phase:
          type: ["string", "null"]
        lastKnownDate:
          type: ["string", "null"]

    AssetCommand:
      type: object
      required: [id]
      properties:
        id:
          type: string
        command:
          type: ["string", "null"]
        phase:
          type: ["string", "null"]
        createdDt:
          type: ["string", "null"]
        correlationId:
          type: ["string", "null"]

    AssetTechStatus:
      type: object
      required: [assetId, name, imeis]
      properties:
        assetId:
          type: string
        name:
          type: string
        lifecycleState:
          type: ["string", "null"]
        purpose:
          type: ["string", "null"]
        waterSystemName:
          type: ["string", "null"]
        countryName:
          type: ["string", "null"]
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        lastCommsDt:
          type: ["string", "null"]
        lastNetwork:
          type: ["string", "null"]
        tapEventsPerMinuteToday:
          type: ["number", "null"]
        tapEventsPerMinuteThisWeek:
          type: ["number", "null"]
        batteryVoltage:
          type: ["number", "null"]
        batteryTrend:
          type: ["string", "null"]
        batteryTodayHigh:
          type: ["number", "null"]
        batteryTodayLow:
          type: ["number", "null"]
        lowBatteryEventCount:
          type: ["integer", "null"]
        healthFlags:
          type: ["string", "null"]
        tamperSwitchState:
          type: ["string", "null"]
        litresDispensedToday:
          type: ["number", "null"]
        lastUsageDt:
          type: ["string", "null"]
        flowRateHour:
          type: ["number", "null"]
        flowRateToday:
          type: ["number", "null"]
        flowRateWeek:
          type: ["number", "null"]
        imeis:
          type: array
          items:
            type: string
        firmware:
          type: array
          items:
            $ref: "#/components/schemas/FirmwareDevice"
        recentCommands:
          type: array
          items:
            $ref: "#/components/schemas/AssetCommand"
        priceOfWater:
          type: ["number", "null"]
        ewcFcf:
          type: ["number", "null"]
        ewcLcf:
          type: ["number", "null"]
        ewcFx:
          type: ["number", "null"]
        ewcPreload:
          type: ["number", "null"]

    UdpModemHealth:
      type: object
      required:
        - imei
        - fetchStatus
        - fetchedAt
        - lastSyncAt
        - network
        - firmwareVersion
        - iccid
        - modemType
        - signal
        - source
        - error
      properties:
        imei:
          type: string
        fetchStatus:
          type: string
          enum: [success, not_found, invalid_imei, invalid_response, timeout, unavailable]
        fetchedAt:
          type: string
        lastSyncAt:
          type: ["string", "null"]
        network:
          type: ["string", "null"]
        firmwareVersion:
          type: ["string", "null"]
        iccid:
          type: ["string", "null"]
        modemType:
          type: ["string", "null"]
        signal:
          type: ["string", "null"]
        source:
          type: string
          enum: [ewater_udp]
        error:
          type: ["string", "null"]

    UdpCommunicationsSummary:
      type: object
      required: [status, selectedImei, lastSyncAt, ageSeconds, source, reason]
      properties:
        status:
          type: string
          enum: [online, offline, unknown]
        selectedImei:
          type: ["string", "null"]
        lastSyncAt:
          type: ["string", "null"]
        ageSeconds:
          type: ["integer", "null"]
        source:
          type: string
          enum: [ewater_udp]
        reason:
          type: string

    AssetUdpHealth:
      type: object
      required: [assetId, imeis, modems, lookupLimited, omittedImeiCount, summary, fetchedAt]
      properties:
        assetId:
          type: string
        imeis:
          type: array
          items:
            type: string
        modems:
          type: array
          items:
            $ref: "#/components/schemas/UdpModemHealth"
        lookupLimited:
          type: boolean
          description: True when more than the per-asset safety limit of known IMEIs were found
        omittedImeiCount:
          type: integer
          minimum: 0
          description: Number of known IMEIs not queried because of the per-asset safety limit
        summary:
          $ref: "#/components/schemas/UdpCommunicationsSummary"
        fetchedAt:
          type: string

    AssetEwcSettings:
      type: object
      properties:
        priceOfWater:
          type: ["number", "null"]
        ewcFcf:
          type: ["number", "null"]
        ewcLcf:
          type: ["number", "null"]
        ewcFx:
          type: ["number", "null"]
        ewcPreload:
          type: ["number", "null"]
        flowPreloadCharge:
          type: ["number", "null"]
        flowPreloadThreshold:
          type: ["number", "null"]
        valveDriveTime:
          type: ["number", "null"]
        dispenseTimeLimitMins:
          type: ["number", "null"]
        dispenseFlowLimitLpm:
          type: ["number", "null"]
        noFlowCycleCount:
          type: ["number", "null"]
        noFlowPulseCount:
          type: ["number", "null"]
        noFlowLockoutMins:
          type: ["number", "null"]
        noFlowErrorControl:
          type: ["number", "null"]
        lowBatteryWarningAdc:
          type: ["number", "null"]
        highBatteryValueAdc:
          type: ["number", "null"]
        healthStateReportPeriod:
          type: ["number", "null"]
        firstExtendedPolling:
          type: ["number", "null"]
        secondExtendedPolling:
          type: ["number", "null"]
        mifareBlockAddress:
          type: ["number", "null"]
        ewcAccessKey:
          type: ["number", "null"]
        encryptionControl:
          type: ["number", "null"]
        encryptionSeed:
          type: ["number", "null"]
        keyA:
          type: ["number", "null"]
        ewcAuthCode:
          type: ["number", "null"]
        supertapEncryptionMask:
          type: ["number", "null"]
        smartDisplayControl:
          type: ["number", "null"]
        proximityDetection:
          type: ["number", "null"]
        ewcDeviceId:
          type: ["number", "null"]
        powerCount:
          type: ["number", "null"]
        settingsDate:
          type: ["string", "null"]

    ESenseTankPoint:
      type: object
      required: [time]
      properties:
        time:
          type: string
        waterTank:
          type: ["number", "null"]
        waterTankMin:
          type: ["number", "null"]
        waterTankMax:
          type: ["number", "null"]
        chlorineTank:
          type: ["number", "null"]
        chlorineTankMin:
          type: ["number", "null"]
        chlorineTankMax:
          type: ["number", "null"]

    ESenseInflowDay:
      type: object
      required: [date, litres]
      properties:
        date:
          type: string
        litres:
          type: number

    ESenseVoltagePoint:
      type: object
      required: [time, value]
      properties:
        time:
          type: string
        value:
          type: number

    ESenseFlowRatePoint:
      type: object
      required: [time, flowRate, ticks, flowTimeSec]
      properties:
        time:
          type: string
        flowRate:
          type: number
          description: Flow rate in litres per minute
        ticks:
          type: number
          description: Raw flow meter tick count for this dispense event
        flowTimeSec:
          type: number
          description: Flow duration in seconds for this dispense event

    ESenseVoltageStatus:
      type: object
      properties:
        current:
          type: ["number", "null"]
        todayHigh:
          type: ["number", "null"]
        todayLow:
          type: ["number", "null"]
        todayAverage:
          type: ["number", "null"]
        trend:
          type: ["string", "null"]

    ESenseChartsData:
      type: object
      required: [tankHeight, dailyInflow, voltageHistory, flowRateHistory]
      properties:
        tankHeight:
          type: array
          items:
            $ref: "#/components/schemas/ESenseTankPoint"
        dailyInflow:
          type: array
          items:
            $ref: "#/components/schemas/ESenseInflowDay"
        voltageHistory:
          type: array
          items:
            $ref: "#/components/schemas/ESenseVoltagePoint"
        voltageStatus:
          $ref: "#/components/schemas/ESenseVoltageStatus"
        flowRateHistory:
          type: array
          items:
            $ref: "#/components/schemas/ESenseFlowRatePoint"
          description: Per-dispense flow rates decoded from 0x44 DATALOG packets (flow_time > 10 s)
        dispenseVolumes:
          $ref: "#/components/schemas/ESenseDispenseVolumes"

    ESenseDispenseVolumeBin:
      type: object
      required: [binStart, count]
      properties:
        binStart:
          type: number
          description: Lower edge of the 1 L bin (10..29)
        count:
          type: integer
          description: Number of dispenses whose volume falls in [binStart, binStart+1); the last bin (29) is inclusive of 30 L exactly

    ESenseDispenseVolumes:
      type: object
      required: [bins, sampleCount, currentLcf, currentPreload, kdePeak, measuredPreload, preloadSampleCount, suggestedLcf]
      properties:
        bins:
          type: array
          items:
            $ref: "#/components/schemas/ESenseDispenseVolumeBin"
          description: 1 L histogram bins from 10 to 30 L
        kdeCurve:
          type: array
          items:
            type: object
            required: [x, y]
            properties:
              x:
                type: number
              y:
                type: number
          description: Gaussian KDE evaluated on a 0.05 L grid over 10-30 L (scaled to histogram counts)
        sampleCount:
          type: integer
          description: Number of in-range (10-30 L) dispenses in the period
        currentLcf:
          type: ["number", "null"]
          description: The asset's LCF (ticks per litre); null when not configured
        currentPreload:
          type: ["number", "null"]
          description: The asset's current Preload setting (tick offset); null when not configured (treated as 0 in the correction math)
        kdePeak:
          type: ["number", "null"]
          description: Exact typical dispense volume in litres (KDE density maximum); null when sampleCount < 10
        measuredPreload:
          type: ["number", "null"]
          description: Average unmetered ticks (bytes 18-19, valve-close overrun) from event-type 0x01 "no credit" DATALOG packets in the period; null when no such packets were received
        preloadSampleCount:
          type: integer
          description: Number of event-type 0x01 packets the measured preload average is based on
        suggestedLcf:
          type: ["integer", "null"]
          description: "Suggested LCF for a true 20 L typical fill: round((kdePeak x currentLcf - measuredPreload) / 20), measuredPreload null -> 0; null when kdePeak is unavailable or the result is not positive"

    RawPacketLog:
      type: object
      required: [id, timeReceived, pipeline, protocol]
      properties:
        id:
          type: string
        timeReceived:
          type: string
        pipeline:
          type: string
        protocol:
          type: string
        assetId:
          type: ["string", "null"]
        imei:
          type: ["string", "null"]
        serial:
          type: ["string", "null"]
        valid:
          type: ["boolean", "null"]
        messageType:
          type: ["string", "null"]
        messageFunction:
          type: ["string", "null"]
        meterReading:
          type: ["number", "null"]
        prepayLitres:
          type: ["number", "null"]
        supplyVoltage:
          type: ["number", "null"]
        batteryState:
          type: ["string", "null"]
        valveStatus:
          type: ["string", "null"]
        signalPower:
          type: ["string", "null"]
        signalSnr:
          type: ["string", "null"]
        errorCode:
          type: ["number", "null"]
        magneticAttack:
          type: ["boolean", "null"]
        description:
          type: ["string", "null"]

    ProxyInput:
      type: object
      required: [api, path, method]
      properties:
        api:
          type: string
          description: "One of: query, state, command, auth"
        path:
          type: string
          description: "API path, e.g. /api/Tap/GetAll"
        method:
          type: string
          description: "HTTP method: GET, POST, PUT, DELETE"
        body:
          type: object
          additionalProperties: true

    ProxyResponse:
      type: object
      required: [status]
      properties:
        status:
          type: integer
        data:
          type: object
          additionalProperties: true

    NotifierSystemConfig:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    NotifierSettings:
      type: object
      required: [enabled, refreshMinutes, systems]
      properties:
        webhookUrl:
          type: ["string", "null"]
        enabled:
          type: boolean
        refreshMinutes:
          type: integer
          minimum: 5
          maximum: 1440
        systems:
          type: array
          items:
            $ref: "#/components/schemas/NotifierSystemConfig"
        updatedAt:
          type: ["string", "null"]
        lastRunAt:
          type: ["string", "null"]
        lastResult:
          type: ["string", "null"]
        lastError:
          type: ["string", "null"]

    NotifierSettingsInput:
      type: object
      properties:
        webhookUrl:
          type: string
          description: "http(s):// URL or empty string to clear"
        enabled:
          type: boolean
        refreshMinutes:
          type: integer
          minimum: 5
          maximum: 1440
        systems:
          type: array
          items:
            $ref: "#/components/schemas/NotifierSystemConfig"
          minItems: 1

    NotifierTestResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        text:
          type: string
          description: Summary text on success
        error:
          type: string
          description: Error message on failure

    # ── HHC (Household Meter Commissioning) ─────────────────────────────────

    ObservedField:
      type: object
      required: [value, observedAt]
      description: A single field observation with the timestamp of the packet it came from
      properties:
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
        observedAt:
          type: string
          description: ISO timestamp of the packet that carried this value

    ShengdaDeviceInfo:
      type: object
      description: Device Info section (/3/0) — map of field name to observation, null when never observed
      additionalProperties:
        oneOf:
          - $ref: "#/components/schemas/ObservedField"
          - type: "null"

    ShengdaMeterState:
      type: object
      description: Meter Basic section (/80/0) — map of field name to observation, null when never observed
      additionalProperties:
        oneOf:
          - $ref: "#/components/schemas/ObservedField"
          - type: "null"

    ShengdaValveState:
      type: object
      description: Valve Control section (/81/0) — map of field name to observation, null when never observed
      additionalProperties:
        oneOf:
          - $ref: "#/components/schemas/ObservedField"
          - type: "null"

    ShengdaAlarmState:
      type: object
      description: Abnormal Alarm section (/82/0) — map of field name to observation, null when never observed
      additionalProperties:
        oneOf:
          - $ref: "#/components/schemas/ObservedField"
          - type: "null"

    ShengdaReportingState:
      type: object
      description: Reporting Config section (/84/0) — map of field name to observation, null when never observed
      additionalProperties:
        oneOf:
          - $ref: "#/components/schemas/ObservedField"
          - type: "null"

    ShengdaNetworkState:
      type: object
      description: NB Delivery section (/99/0) — map of field name to observation, null when never observed
      additionalProperties:
        oneOf:
          - $ref: "#/components/schemas/ObservedField"
          - type: "null"

    ShengdaCurrentState:
      type: object
      required: [device, meter, valve, alarms, reporting, network, validPacketCount, invalidPackets]
      properties:
        device:
          $ref: "#/components/schemas/ShengdaDeviceInfo"
        meter:
          $ref: "#/components/schemas/ShengdaMeterState"
        valve:
          $ref: "#/components/schemas/ShengdaValveState"
        alarms:
          $ref: "#/components/schemas/ShengdaAlarmState"
        reporting:
          $ref: "#/components/schemas/ShengdaReportingState"
        network:
          $ref: "#/components/schemas/ShengdaNetworkState"
        lastPacketAt:
          type: ["string", "null"]
        lastValidPacketAt:
          type: ["string", "null"]
        validPacketCount:
          type: integer
        invalidPackets:
          type: array
          items:
            type: object
            required: [id, timestamp]
            properties:
              id:
                type: string
              timestamp:
                type: string

    ConnectivityEvaluation:
      type: object
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [healthy, late, offline, unknown]
        lastValidPacketAt:
          type: ["string", "null"]
        reportCycleSeconds:
          type: ["number", "null"]
        silenceSeconds:
          type: ["number", "null"]
        reason:
          type: string

    HealthReason:
      type: object
      required: [severity, code, message]
      properties:
        severity:
          type: string
          enum: [ok, warning, critical]
        code:
          type: string
        message:
          type: string
        observedAt:
          type: ["string", "null"]

    HealthEvaluation:
      type: object
      required: [status, reasons]
      properties:
        status:
          type: string
          enum: [healthy, warning, critical, unknown]
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/HealthReason"

    HouseholdMeterSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        waterSystemName:
          type: ["string", "null"]
        countryName:
          type: ["string", "null"]
        parentId:
          type: ["number", "null"]
        fetchedAt:
          type: string

    HouseholdMeterListPage:
      type: object
      required: [items, totalCount, returnedCount, offset, limit, hasMore, fetchedAt]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HouseholdMeterSummary"
        totalCount:
          type: integer
        returnedCount:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        hasMore:
          type: boolean
        fetchedAt:
          type: string

    HouseholdMeterState:
      type: object
      required: [assetId, state, connectivity, health, fetchedAt]
      properties:
        assetId:
          type: string
        meter:
          oneOf:
            - $ref: "#/components/schemas/HouseholdMeterSummary"
            - type: "null"
        state:
          $ref: "#/components/schemas/ShengdaCurrentState"
        connectivity:
          $ref: "#/components/schemas/ConnectivityEvaluation"
        health:
          $ref: "#/components/schemas/HealthEvaluation"
        fetchedAt:
          type: string
        sourceObservedAt:
          type: ["string", "null"]
          description: Timestamp of the newest valid device observation used

    HistoryBucket:
      type: object
      required: [bucketStart, bucketEnd, discontinuity, readingCount]
      properties:
        bucketStart:
          type: string
        bucketEnd:
          type: string
        consumptionLitres:
          type: ["number", "null"]
          description: Litres consumed in this bucket; null when no diff computable
        discontinuity:
          type: boolean
          description: True when a counter reset (negative diff) fell in this bucket
        readingCount:
          type: integer

    HouseholdMeterHistory:
      type: object
      required: [assetId, period, buckets, discontinuityCount, fetchedAt]
      properties:
        assetId:
          type: string
        period:
          type: string
          enum: ["24h", "7d", "30d", "90d"]
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/HistoryBucket"
        totalConsumptionLitres:
          type: ["number", "null"]
        firstReadingLitres:
          type: ["number", "null"]
        lastReadingLitres:
          type: ["number", "null"]
        discontinuityCount:
          type: integer
        fetchedAt:
          type: string

    HouseholdMeterCommunication:
      type: object
      required: [id, timestamp]
      properties:
        id:
          type: string
        timestamp:
          type: string
        imei:
          type: ["string", "null"]
        pipeline:
          type: ["string", "null"]
        protocol:
          type: ["string", "null"]
        valid:
          type: ["boolean", "null"]
          description: CRC validity; null when the payload is not a Shengda frame
        messageType:
          type: ["string", "null"]
        messageFunction:
          type: ["string", "null"]
        meterReadingLitres:
          type: ["number", "null"]
        description:
          type: ["string", "null"]

    HouseholdMeterCommunicationsPage:
      type: object
      required: [items, totalCount, returnedCount, offset, limit, hasMore, fetchedAt]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HouseholdMeterCommunication"
        totalCount:
          type: integer
        returnedCount:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        hasMore:
          type: boolean
        fetchedAt:
          type: string

    CommissioningSession:
      type: object
      required: [assetId, stage, createdAt, updatedAt]
      properties:
        assetId:
          type: string
        stage:
          type: string
          enum: [gate1, gate2, gate3, approved]
        commissioningTestStartedAt:
          type: ["string", "null"]
        batchSize:
          type: ["number", "null"]
        approvedAt:
          type: ["string", "null"]
        approvedBy:
          type: ["string", "null"]
        overrideReason:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
        updatedBy:
          type: ["string", "null"]

    QcEvidence:
      type: object
      description: Machine-readable evidence for a QC result (source field reference, observed/expected values, packet provenance)
      properties:
        sourceField:
          type: string
          description: e.g. "Shengda /80/0 field 37"
        observedValue: {}
        expectedValue: {}
        observedAt:
          type: ["string", "null"]
        packetId:
          type: ["string", "null"]
        imei:
          type: ["string", "null"]
        receivedAt:
          type: ["string", "null"]
      additionalProperties: true

    QcResult:
      type: object
      required: [checkCode, gate, source, label, mandatory, result, detail]
      properties:
        checkCode:
          type: string
        gate:
          type: integer
        source:
          type: string
          enum: [AUTO, MANUAL]
        label:
          type: string
        mandatory:
          type: boolean
        result:
          type: string
          enum: [PASS, FAIL, PENDING]
        detail:
          type: string
        evidence:
          oneOf:
            - $ref: "#/components/schemas/QcEvidence"
            - type: "null"
        operator:
          type: ["string", "null"]
        recordedAt:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    CommissioningBlocker:
      type: object
      required: [checkCode, label, detail]
      properties:
        checkCode:
          type: string
        label:
          type: string
        detail:
          type: string

    CommsDelivery:
      type: object
      required: [packetId, receivedAt, crcValid, counted]
      properties:
        packetId:
          type: string
        receivedAt:
          type: string
        deviceTime:
          type: ["string", "null"]
        crcValid:
          type: boolean
        counted:
          type: boolean
          description: True when the delivery counts towards the three-communication test (CRC-valid, received after test start)

    CommsTestStatus:
      type: object
      required: [requiredCount, validCount, deliveries]
      properties:
        startedAt:
          type: ["string", "null"]
        requiredCount:
          type: integer
        validCount:
          type: integer
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/CommsDelivery"

    RtcDriftStatus:
      type: object
      properties:
        deviceTime:
          type: ["string", "null"]
        serverReceivedAt:
          type: ["string", "null"]
        driftSeconds:
          type: ["number", "null"]
        toleranceSeconds:
          type: ["number", "null"]
        packetId:
          type: ["string", "null"]

    Gate3Sampling:
      type: object
      description: >-
        Informational Gate 3 acceptance-sampling guidance for the batch this
        meter belongs to. Batch membership tracking and enforcement of sample
        completion as an approval gate arrive with the O&M phase; per-meter
        approval is gated on the QC checklist, not on sampling.
      required: [samplePct]
      properties:
        batchSize:
          type: ["number", "null"]
        samplePct:
          type: number
        requiredSampleSize:
          type: ["number", "null"]
          description: ceil(batchSize × samplePct / 100)

    OperatorLoginBody:
      type: object
      required: [operatorName, accessKey]
      properties:
        operatorName:
          type: string
        accessKey:
          type: string

    OperatorSession:
      type: object
      required: [token, operator, role, expiresAt]
      properties:
        token:
          type: string
        operator:
          type: string
        role:
          type: string
          enum: [operator, admin]
        expiresAt:
          type: string

    CommissioningDetail:
      type: object
      required: [assetId, session, checks, blockers, canApprove, commsTest, rtcDrift, sampling, connectivity, config, evaluatedAt]
      properties:
        assetId:
          type: string
        session:
          $ref: "#/components/schemas/CommissioningSession"
        checks:
          type: array
          items:
            $ref: "#/components/schemas/QcResult"
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/CommissioningBlocker"
        canApprove:
          type: boolean
        commsTest:
          $ref: "#/components/schemas/CommsTestStatus"
        rtcDrift:
          $ref: "#/components/schemas/RtcDriftStatus"
        sampling:
          $ref: "#/components/schemas/Gate3Sampling"
        connectivity:
          $ref: "#/components/schemas/ConnectivityEvaluation"
        config:
          $ref: "#/components/schemas/HhcConfiguration"
        evaluatedAt:
          type: string
        fetchedAt:
          type: string
        sourceObservedAt:
          type: ["string", "null"]

    UpdateCommissioningBody:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [setStage, startCommsTest, setBatchSize, recordManualCheck, approve]
        stage:
          type: string
          enum: [gate1, gate2, gate3]
          description: Required for setStage
        batchSize:
          type: integer
          minimum: 1
          description: Required for setBatchSize
        checkCode:
          type: string
          description: Required for recordManualCheck (MANUAL checks only)
        result:
          type: string
          enum: [PASS, FAIL, PENDING]
          description: Required for recordManualCheck
        notes:
          type: ["string", "null"]
        evidence:
          type: ["object", "null"]
          additionalProperties: true
        overrideReason:
          type: ["string", "null"]
          description: For approve — authorised override reason when blockers exist

    HhcConfiguration:
      type: object
      required: [batteryCriticalVoltage, batteryWarningVoltage, gate3SamplePct, requiredOverdraftLitres, tariffKesPer1000L]
      properties:
        batteryCriticalVoltage:
          type: number
        batteryWarningVoltage:
          type: number
        gate3SamplePct:
          type: number
        rtcToleranceSeconds:
          type: ["number", "null"]
        requiredOverdraftLitres:
          type: number
        tariffKesPer1000L:
          type: number
        updatedAt:
          type: ["string", "null"]
        updatedBy:
          type: ["string", "null"]
        fetchedAt:
          type: string

    HhcConfigurationUpdate:
      type: object
      properties:
        batteryCriticalVoltage:
          type: number
        batteryWarningVoltage:
          type: number
        gate3SamplePct:
          type: number
          minimum: 0
          maximum: 100
        rtcToleranceSeconds:
          type: ["integer", "null"]
        requiredOverdraftLitres:
          type: number
        tariffKesPer1000L:
          type: number

    ModemIccidBody:
      type: object
      required: [iccid]
      properties:
        iccid:
          type: string
          minLength: 10
          maxLength: 30

    ModemIccidResult:
      type: object
      required: [ok, iccid, pulseStatus]
      properties:
        ok:
          type: boolean
        iccid:
          type: string
        pulseStatus:
          type: integer
        pulseResponse: {}
        fetchedAt:
          type: string

    JobTypesResult:
      type: object
      required: [jobTypes]
      properties:
        jobTypes:
          description: Raw job type list from Pulse
          type: array
          items: {}
        fetchedAt:
          type: string

