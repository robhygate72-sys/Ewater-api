      properties:
        time:
          type: string
        flowRate:
          type: number
          description: Flow rate in litres per minute
        ticks:
          type: number
          description: Raw flow meter tick count for this dispense event
        flowTimeSec:
          type: number
          description: Flow duration in seconds for this dispense event

    ESenseVoltageStatus:
      type: object
      properties:
        current:
          type: ["number", "null"]
        todayHigh:
          type: ["number", "null"]
        todayLow:
