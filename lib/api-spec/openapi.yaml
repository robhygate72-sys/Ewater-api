openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: eWater Monitor API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ewater
    description: eWater API proxy operations
  - name: notifier
    description: Registration webhook notifier
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /ewater/credentials:
    get:
      operationId: getCredentialsStatus
      tags: [ewater]
      summary: Check if eWater credentials are configured
      responses:
        "200":
          description: Credentials status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsStatus"
    post:
      operationId: saveCredentials
      tags: [ewater]
      summary: Save eWater credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsInput"
      responses:
        "200":
          description: Credentials saved and token obtained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsStatus"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: clearCredentials
      tags: [ewater]
      summary: Clear saved eWater credentials
      responses:
        "200":
          description: Credentials cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsStatus"

  /ewater/assets:
    get:
      operationId: listAssets
      tags: [ewater]
      summary: List all assets (community taps, controllers, etc.)
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}:
    get:
      operationId: getAsset
      tags: [ewater]
      summary: Get asset details
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/telemetry:
    get:
      operationId: fetchAssetTelemetry
      tags: [ewater]
      summary: Get telemetry data for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Telemetry entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TelemetryEntry"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/dashboard:
    get:
      operationId: getDashboard
      tags: [ewater]
      summary: Get system health summary for the dashboard
      parameters:
        - name: lifecycleState
          in: query
          required: false
          schema:
            type: string
            enum: [PreInstallation, Staged, Active]
            default: Active
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/entities:
    get:
      operationId: getEntityHierarchy
      tags: [ewater]
      summary: Get entity hierarchy (countries → water systems)
      responses:
        "200":
          description: Entity hierarchy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityHierarchy"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/tech:
    get:
      operationId: getAssetTech
      tags: [ewater]
      summary: Get comprehensive technical status for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset technical status bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetTechStatus"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/ewc:
    get:
      operationId: getAssetEwc
      tags: [ewater]
      summary: Get EWC calibration settings and calculated price of water for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: EWC settings and price of water
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetEwcSettings"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/esense-charts:
    get:
      operationId: getESenseCharts
      tags: [ewater]
      summary: Get eSense chart data (tank height, daily inflow, voltage) over a time range
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 3
      responses:
        "200":
          description: eSense chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ESenseChartsData"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/meter-reading:
    get:
      operationId: getAssetMeterReading
      tags: [ewater]
      summary: Get the latest tick-accumulator meter reading from HEALTH_STATE packets
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Meter reading result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterReadingResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/packets:
    get:
      operationId: getAssetPackets
      tags: [ewater]
      summary: Get decoded raw NB-IoT packet logs for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 24
            minimum: 1
            maximum: 72
          description: How many hours back to look (1-72, default 24)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          description: Max packets to return (1-100, default 50)
        - name: imei
          in: query
          required: false
          schema:
            type: string
          description: Restrict to a single IMEI. Omit to merge packets across all IMEIs registered for the asset.
      responses:
        "200":
          description: Decoded packet log entries, newest first, merged across all IMEIs for the asset unless `imei` is given. Empty array if asset has no IMEI.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RawPacketLog"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/reset-meter:
    post:
      operationId: resetAssetMeter
      tags: [ewater]
      summary: Reset the tick accumulator to a given litre value via eWater command API
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetMeterBody"
      responses:
        "200":
          description: Reset result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetMeterResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/apply-calibration:
    post:
      operationId: applyAssetCalibration
      tags: [ewater]
      summary: Write the suggested LCF (LitresConversion) and measured Preload settings to the device via the eWater RequestSettingChange API
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyCalibrationBody"
      responses:
        "200":
          description: Per-setting write results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyCalibrationResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/flow-rate:
    get:
      operationId: getAssetFlowRate
      tags: [ewater]
      summary: Get most recent valid flow rate (L/min) from last 24 hours of EWC logs
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Flow rate result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowRateResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/proxy:
    post:
      operationId: proxyRequest
      tags: [ewater]
      summary: Generic proxy to any eWater API endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxyInput"
      responses:
        "200":
          description: Proxied response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifier/settings:
    get:
      operationId: getNotifierSettings
      tags: [notifier]
      summary: Get registration webhook notifier settings and last run status
      responses:
        "200":
          description: Notifier settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifierSettings"

    put:
      operationId: updateNotifierSettings
      tags: [notifier]
      summary: Update registration webhook notifier settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifierSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifierSettings"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifier/test:
    post:
      operationId: testNotifier
      tags: [notifier]
      summary: Run one registration gather-and-send cycle immediately (ignores enabled flag)
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifierTestResult"
        "400":
          description: No webhook URL configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Gather or send failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifierTestResult"

  /ewater/hhc/meters:
    get:
      operationId: listHouseholdMeters
      tags: [ewater]
      summary: List household meters (paginated, filterable)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter by asset lifecycle state (case-insensitive)
        - name: waterSystemId
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Substring match on meter name or asset ID
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Paginated household meter list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdMeterListPage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/meters/{assetId}:
    get:
      operationId: getHouseholdMeter
      tags: [ewater]
      summary: Get household meter summary
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Household meter summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdMeterSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not a household meter or not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/meters/{assetId}/state:
    get:
      operationId: getHouseholdMeterState
      tags: [ewater]
      summary: Get authoritative current Shengda state (reducer output) with connectivity and health
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current meter state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdMeterState"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/meters/{assetId}/history:
    get:
      operationId: getHouseholdMeterHistory
      tags: [ewater]
      summary: Get bucketed usage history from cumulative meter readings (reset-aware)
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: ["24h", "7d", "30d", "90d"]
            default: "7d"
      responses:
        "200":
          description: Usage history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdMeterHistory"
        "400":
          description: Invalid period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/meters/{assetId}/communications:
    get:
      operationId: getHouseholdMeterCommunications
      tags: [ewater]
      summary: Get decoded packet log for a household meter (paginated, filterable)
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 72
            minimum: 1
            maximum: 720
        - name: validOnly
          in: query
          required: false
          schema:
            type: boolean
          description: Only CRC-valid packets
        - name: messageFunction
          in: query
          required: false
          schema:
            type: string
          description: Substring filter on message function label
        - name: imei
          in: query
          required: false
          schema:
            type: string
          description: Substring filter on source IMEI
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Paginated decoded packet log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdMeterCommunicationsPage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/hhc/meters/{assetId}/commissioning:
    get:
      operationId: getHouseholdMeterCommissioning
      tags: [ewater]
      summary: Get commissioning status and auto-check results
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Commissioning status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissioningStatus"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ResetMeterBody:
      type: object
      required: [litres]
      properties:
        litres:
          type: number
          description: Target accumulated meter reading in litres (litreValue)

    ResetMeterResult:
      type: object
      required: [litres, success]
      properties:
        litres:
          type: number
          description: Litre value sent to the device
        success:
          type: boolean
        error:
          type: string
          nullable: true

    ApplyCalibrationBody:
      type: object
      required: [lcf, preload]
      properties:
        lcf:
          type: integer
          minimum: 1
          description: LCF (LitresConversion, ticks per litre) to write
        preload:
          type: integer
          minimum: 0
          description: Preload (unmetered tick offset) to write — the measured preload rounded to an integer, 0 when none was measured

    ApplyCalibrationSettingResult:
      type: object
      required: [settingKey, success]
      properties:
        settingKey:
          type: string
          description: eWater setting key written (LitresConversion or Preload)
        success:
          type: boolean
        error:
          type: string
          nullable: true

    ApplyCalibrationResult:
      type: object
      required: [success, results]
      properties:
        success:
          type: boolean
          description: True only if every setting change was accepted
        results:
          type: array
          items:
            $ref: "#/components/schemas/ApplyCalibrationSettingResult"

    MeterReadingResult:
      type: object
      required: [found]
      properties:
        ticks:
          type: number
          nullable: true
          description: Raw ECR tick accumulator from latest HEALTH_STATE packet
        lcf:
          type: number
          nullable: true
          description: Ticks per litre (LCF) from the packet
        litres:
          type: number
          nullable: true
          description: Computed litres (ticks / LCF)
        timestamp:
          type: string
          nullable: true
          description: ISO timestamp of the HEALTH_STATE packet
        found:
          type: boolean
          description: False when no HEALTH_STATE packet found in last 14 days

    FlowRateResult:
      type: object
      required: [timedOut]
      properties:
        flowRate:
          type: number
          nullable: true
          description: Most recent flow rate in L/min (null if none found)
        timestamp:
          type: string
          nullable: true
          description: ISO timestamp of the most recent valid dispense event
        timedOut:
          type: boolean
          description: True when no valid dispense event found in the last 24 hours

    CredentialsInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    CredentialsStatus:
      type: object
      required: [isConfigured]
      properties:
        isConfigured:
          type: boolean
        environment:
          type: ["string", "null"]
        tokenExpiresAt:
          type: ["string", "null"]

    Asset:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
        isOnline:
          type: ["boolean", "null"]
        location:
          type: ["string", "null"]
        lastSeen:
          type: ["string", "null"]
        batteryVoltage:
          type: ["number", "null"]
        signalStrength:
          type: ["number", "null"]
        hasPowerFault:
          type: ["boolean", "null"]
        hasFlowFault:
          type: ["boolean", "null"]
        parentId:
          type: ["integer", "null"]
        waterSystemName:
          type: ["string", "null"]
        countryName:
          type: ["string", "null"]
        rawData:
          type: object
          additionalProperties: true

    TelemetryEntry:
      type: object
      required: [id, assetId, timestamp]
      properties:
        id:
          type: string
        assetId:
          type: string
        timestamp:
          type: string
        imei:
          type: ["string", "null"]
        correlationId:
          type: ["string", "null"]
        pipeline:
          type: ["string", "null"]
        payload:
          type: ["string", "null"]
        rawData:
          type: object
          additionalProperties: true

    DashboardSummary:
      type: object
      required: [totalAssets, onlineCount, offlineCount, faultCount, lifecycleFilter]
      properties:
        totalAssets:
          type: integer
        onlineCount:
          type: integer
        offlineCount:
          type: integer
        faultCount:
          type: integer
        powerFaultCount:
          type: integer
        flowFaultCount:
          type: integer
        lastUpdated:
          type: ["string", "null"]
        lifecycleFilter:
          type: string
        recentAlerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"

    Alert:
      type: object
      required: [id, assetId, message, severity]
      properties:
        id:
          type: string
        assetId:
          type: string
        assetName:
          type: ["string", "null"]
        message:
          type: string
        severity:
          type: string
        timestamp:
          type: string

    EntityWaterSystem:
      type: object
      required: [id, name, assetCount]
      properties:
        id:
          type: integer
        name:
          type: string
        assetCount:
          type: integer

    EntityCountry:
      type: object
      required: [id, name, waterSystems]
      properties:
        id:
          type: integer
        name:
          type: string
        waterSystems:
          type: array
          items:
            $ref: "#/components/schemas/EntityWaterSystem"

    EntityHierarchy:
      type: object
      required: [countries]
      properties:
        countries:
          type: array
          items:
            $ref: "#/components/schemas/EntityCountry"

    FirmwareDevice:
      type: object
      required: [deviceType]
      properties:
        deviceType:
          type: string
        version:
          type: ["string", "null"]
        phase:
          type: ["string", "null"]
        lastKnownDate:
          type: ["string", "null"]

    AssetCommand:
      type: object
      required: [id]
      properties:
        id:
          type: string
        command:
          type: ["string", "null"]
