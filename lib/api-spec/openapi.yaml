      type: object
      required: [jobTypeId]
      properties:
        jobTypeId:
          type: string
        title:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        priority:
          type: ["integer", "null"]
          minimum: 1
          maximum: 5
        dueDt:
          type: ["string", "null"]
          description: ISO datetime with offset
        assigneeUserId:
          type: ["string", "null"]
        faultObservation:
          type: ["string", "null"]
          description: Required observation value for fault-linked job types

    MaintenanceJobResult:
      type: object
      required: [job]
      properties:
        job:
          $ref: "#/components/schemas/PulseJob"
        fetchedAt:
          type: string

    ReassignJobBody:
      type: object
      required: [assigneeUserId]
      properties:
        assigneeUserId:
          type: string

    CancelJobBody:
      type: object
      properties:
        reason:
          type: ["string", "null"]
          description: Recorded only in the local audit trail (Pulse CancelJob has no reason field)

    RecordJobEventsBody:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [recordType, data]
            properties:
              recordType:
                type: string
                enum: ["Blockage", "ReadingCapture", "PartChange", "Action", "Escalation", "Completion", "WorkStarted"]
              eventDt:
                type: ["string", "null"]
                description: ISO datetime with offset; defaults to now
              data:
                type: ["string", "null"]

    MaintenanceActionResult:
      type: object
      required: [ok, jobInstanceId]
      properties:
        ok:
          type: boolean
        jobInstanceId:
          type: string
        fetchedAt:
          type: string

    HhcActionAudit:
      type: object
      required: [id, assetId, action, operator, reason, detail, createdAt]
      properties:
        id:
          type: integer
        assetId:
          type: ["string", "null"]
        action:
          type: string
        operator:
          type: string
        reason:
          type: ["string", "null"]
        detail:
          description: Sanitised request/response detail (correlationId, endpoint, commandState, upstream status, error)
        createdAt:
          type: string

    HhcActionAuditPage:
      type: object
      required: [assetId, entries]
      properties:
        assetId:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/HhcActionAudit"
        fetchedAt:
          type: string
