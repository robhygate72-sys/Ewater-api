openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: eWater Monitor API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ewater
    description: eWater API proxy operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /ewater/credentials:
    get:
      operationId: getCredentialsStatus
      tags: [ewater]
      summary: Check if eWater credentials are configured
      responses:
        "200":
          description: Credentials status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsStatus"
    post:
      operationId: saveCredentials
      tags: [ewater]
      summary: Save eWater credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsInput"
      responses:
        "200":
          description: Credentials saved and token obtained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsStatus"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: clearCredentials
      tags: [ewater]
      summary: Clear saved eWater credentials
      responses:
        "200":
          description: Credentials cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsStatus"

  /ewater/assets:
    get:
      operationId: listAssets
      tags: [ewater]
      summary: List all assets (community taps, controllers, etc.)
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}:
    get:
      operationId: getAsset
      tags: [ewater]
      summary: Get asset details
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/telemetry:
    get:
      operationId: fetchAssetTelemetry
      tags: [ewater]
      summary: Get telemetry data for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Telemetry entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TelemetryEntry"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/dashboard:
    get:
      operationId: getDashboard
      tags: [ewater]
      summary: Get system health summary for the dashboard
      parameters:
        - name: lifecycleState
          in: query
          required: false
          schema:
            type: string
            enum: [PreInstallation, Staged, Active]
            default: Active
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/entities:
    get:
      operationId: getEntityHierarchy
      tags: [ewater]
      summary: Get entity hierarchy (countries → water systems)
      responses:
        "200":
          description: Entity hierarchy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityHierarchy"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/tech:
    get:
      operationId: getAssetTech
      tags: [ewater]
      summary: Get comprehensive technical status for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset technical status bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetTechStatus"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/ewc:
    get:
      operationId: getAssetEwc
      tags: [ewater]
      summary: Get EWC calibration settings and calculated price of water for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: EWC settings and price of water
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetEwcSettings"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/esense-charts:
    get:
      operationId: getESenseCharts
      tags: [ewater]
      summary: Get eSense chart data (tank height, daily inflow, voltage) over a time range
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 3
      responses:
        "200":
          description: eSense chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ESenseChartsData"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/meter-reading:
    get:
      operationId: getAssetMeterReading
      tags: [ewater]
      summary: Get the latest tick-accumulator meter reading from HEALTH_STATE packets
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Meter reading result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterReadingResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/reset-meter:
    post:
      operationId: resetAssetMeter
      tags: [ewater]
      summary: Reset the tick accumulator to a given litre value via eWater command API
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetMeterBody"
      responses:
        "200":
          description: Reset result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetMeterResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/apply-calibration:
    post:
      operationId: applyAssetCalibration
      tags: [ewater]
      summary: Write the suggested LCF (LitresConversion) setting to the device via the eWater RequestSettingChange API
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyCalibrationBody"
      responses:
        "200":
          description: Per-setting write results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyCalibrationResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/assets/{assetId}/flow-rate:
    get:
      operationId: getAssetFlowRate
      tags: [ewater]
      summary: Get most recent valid flow rate (L/min) from last 24 hours of EWC logs
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Flow rate result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowRateResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ewater/proxy:
    post:
      operationId: proxyRequest
      tags: [ewater]
      summary: Generic proxy to any eWater API endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxyInput"
      responses:
        "200":
          description: Proxied response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ResetMeterBody:
      type: object
      required: [litres]
      properties:
        litres:
          type: number
          description: Target accumulated meter reading in litres (litreValue)

    ResetMeterResult:
      type: object
      required: [litres, success]
      properties:
        litres:
          type: number
          description: Litre value sent to the device
        success:
          type: boolean
        error:
          type: string
          nullable: true

    ApplyCalibrationBody:
      type: object
      required: [lcf]
      properties:
        lcf:
          type: integer
          minimum: 1
          description: LCF (LitresConversion, ticks per litre) to write

    ApplyCalibrationSettingResult:
      type: object
      required: [settingKey, success]
      properties:
        settingKey:
          type: string
          description: eWater setting key written (LitresConversion)
        success:
          type: boolean
        error:
          type: string
          nullable: true

    ApplyCalibrationResult:
      type: object
      required: [success, results]
      properties:
        success:
          type: boolean
          description: True only if every setting change was accepted
        results:
          type: array
          items:
            $ref: "#/components/schemas/ApplyCalibrationSettingResult"

    MeterReadingResult:
      type: object
      required: [found]
      properties:
        ticks:
          type: number
          nullable: true
          description: Raw ECR tick accumulator from latest HEALTH_STATE packet
        lcf:
          type: number
          nullable: true
          description: Ticks per litre (LCF) from the packet
        litres:
          type: number
          nullable: true
          description: Computed litres (ticks / LCF)
        timestamp:
          type: string
          nullable: true
          description: ISO timestamp of the HEALTH_STATE packet
        found:
          type: boolean
          description: False when no HEALTH_STATE packet found in last 14 days

    FlowRateResult:
      type: object
      required: [timedOut]
      properties:
        flowRate:
          type: number
          nullable: true
          description: Most recent flow rate in L/min (null if none found)
        timestamp:
          type: string
          nullable: true
          description: ISO timestamp of the most recent valid dispense event
        timedOut:
          type: boolean
          description: True when no valid dispense event found in the last 24 hours

    CredentialsInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    CredentialsStatus:
      type: object
      required: [isConfigured]
      properties:
        isConfigured:
          type: boolean
        environment:
          type: ["string", "null"]
        tokenExpiresAt:
          type: ["string", "null"]

    Asset:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
        isOnline:
          type: ["boolean", "null"]
        location:
          type: ["string", "null"]
        lastSeen:
          type: ["string", "null"]
        batteryVoltage:
          type: ["number", "null"]
        signalStrength:
          type: ["number", "null"]
        hasPowerFault:
          type: ["boolean", "null"]
        hasFlowFault:
          type: ["boolean", "null"]
        parentId:
          type: ["integer", "null"]
        waterSystemName:
          type: ["string", "null"]
        countryName:
          type: ["string", "null"]
        rawData:
          type: object
          additionalProperties: true

    TelemetryEntry:
      type: object
      required: [id, assetId, timestamp]
      properties:
        id:
          type: string
        assetId:
          type: string
        timestamp:
          type: string
        imei:
          type: ["string", "null"]
        correlationId:
          type: ["string", "null"]
        pipeline:
          type: ["string", "null"]
        payload:
          type: ["string", "null"]
        rawData:
          type: object
          additionalProperties: true

    DashboardSummary:
      type: object
      required: [totalAssets, onlineCount, offlineCount, faultCount, lifecycleFilter]
      properties:
        totalAssets:
          type: integer
        onlineCount:
          type: integer
        offlineCount:
          type: integer
        faultCount:
          type: integer
        powerFaultCount:
          type: integer
        flowFaultCount:
          type: integer
        lastUpdated:
          type: ["string", "null"]
        lifecycleFilter:
          type: string
        recentAlerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"

    Alert:
      type: object
      required: [id, assetId, message, severity]
      properties:
        id:
          type: string
        assetId:
          type: string
        assetName:
          type: ["string", "null"]
        message:
          type: string
        severity:
          type: string
        timestamp:
          type: string

    EntityWaterSystem:
      type: object
      required: [id, name, assetCount]
      properties:
        id:
          type: integer
        name:
          type: string
        assetCount:
          type: integer

    EntityCountry:
      type: object
      required: [id, name, waterSystems]
      properties:
        id:
          type: integer
        name:
          type: string
        waterSystems:
          type: array
          items:
            $ref: "#/components/schemas/EntityWaterSystem"

    EntityHierarchy:
      type: object
      required: [countries]
      properties:
        countries:
          type: array
          items:
            $ref: "#/components/schemas/EntityCountry"

    FirmwareDevice:
      type: object
      required: [deviceType]
      properties:
        deviceType:
          type: string
        version:
          type: ["string", "null"]
        phase:
          type: ["string", "null"]
        lastKnownDate:
          type: ["string", "null"]

    AssetCommand:
      type: object
      required: [id]
      properties:
        id:
          type: string
        command:
          type: ["string", "null"]
        phase:
          type: ["string", "null"]
        createdDt:
          type: ["string", "null"]
        correlationId:
          type: ["string", "null"]

    AssetTechStatus:
      type: object
      required: [assetId, name]
      properties:
        assetId:
          type: string
        name:
          type: string
        lifecycleState:
          type: ["string", "null"]
        purpose:
          type: ["string", "null"]
        waterSystemName:
          type: ["string", "null"]
        countryName:
          type: ["string", "null"]
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        lastCommsDt:
          type: ["string", "null"]
        lastNetwork:
          type: ["string", "null"]
        tapEventsPerMinuteToday:
          type: ["number", "null"]
        tapEventsPerMinuteThisWeek:
          type: ["number", "null"]
        batteryVoltage:
          type: ["number", "null"]
        batteryTrend:
          type: ["string", "null"]
        batteryTodayHigh:
          type: ["number", "null"]
        batteryTodayLow:
          type: ["number", "null"]
        lowBatteryEventCount:
          type: ["integer", "null"]
        healthFlags:
          type: ["string", "null"]
        tamperSwitchState:
          type: ["string", "null"]
        litresDispensedToday:
          type: ["number", "null"]
        lastUsageDt:
          type: ["string", "null"]
        flowRateHour:
          type: ["number", "null"]
        flowRateToday:
          type: ["number", "null"]
        flowRateWeek:
          type: ["number", "null"]
        imei:
          type: ["string", "null"]
        firmware:
          type: array
          items:
            $ref: "#/components/schemas/FirmwareDevice"
        recentCommands:
          type: array
          items:
            $ref: "#/components/schemas/AssetCommand"
        priceOfWater:
          type: ["number", "null"]
        ewcFcf:
          type: ["number", "null"]
        ewcLcf:
          type: ["number", "null"]
        ewcFx:
          type: ["number", "null"]
        ewcPreload:
          type: ["number", "null"]

    AssetEwcSettings:
      type: object
      properties:
        priceOfWater:
          type: ["number", "null"]
        ewcFcf:
          type: ["number", "null"]
        ewcLcf:
          type: ["number", "null"]
        ewcFx:
          type: ["number", "null"]
        ewcPreload:
          type: ["number", "null"]
        flowPreloadCharge:
          type: ["number", "null"]
        flowPreloadThreshold:
          type: ["number", "null"]
        valveDriveTime:
          type: ["number", "null"]
        dispenseTimeLimitMins:
          type: ["number", "null"]
        dispenseFlowLimitLpm:
          type: ["number", "null"]
        noFlowCycleCount:
          type: ["number", "null"]
        noFlowPulseCount:
          type: ["number", "null"]
        noFlowLockoutMins:
          type: ["number", "null"]
        noFlowErrorControl:
          type: ["number", "null"]
        lowBatteryWarningAdc:
          type: ["number", "null"]
        highBatteryValueAdc:
          type: ["number", "null"]
        healthStateReportPeriod:
          type: ["number", "null"]
        firstExtendedPolling:
          type: ["number", "null"]
        secondExtendedPolling:
          type: ["number", "null"]
        mifareBlockAddress:
          type: ["number", "null"]
        ewcAccessKey:
          type: ["number", "null"]
        encryptionControl:
          type: ["number", "null"]
        encryptionSeed:
          type: ["number", "null"]
        keyA:
          type: ["number", "null"]
        ewcAuthCode:
          type: ["number", "null"]
        supertapEncryptionMask:
          type: ["number", "null"]
        smartDisplayControl:
          type: ["number", "null"]
        proximityDetection:
          type: ["number", "null"]
        ewcDeviceId:
          type: ["number", "null"]
        powerCount:
          type: ["number", "null"]
        settingsDate:
          type: ["string", "null"]

    ESenseTankPoint:
      type: object
      required: [time]
      properties:
        time:
          type: string
        waterTank:
          type: ["number", "null"]
        waterTankMin:
          type: ["number", "null"]
        waterTankMax:
          type: ["number", "null"]
        chlorineTank:
          type: ["number", "null"]
        chlorineTankMin:
          type: ["number", "null"]
        chlorineTankMax:
          type: ["number", "null"]

    ESenseInflowDay:
      type: object
      required: [date, litres]
      properties:
        date:
          type: string
        litres:
          type: number

    ESenseVoltagePoint:
      type: object
      required: [time, value]
      properties:
        time:
          type: string
        value:
          type: number

    ESenseFlowRatePoint:
      type: object
      required: [time, flowRate, ticks, flowTimeSec]
      properties:
        time:
          type: string
        flowRate:
          type: number
          description: Flow rate in litres per minute
        ticks:
          type: number
          description: Raw flow meter tick count for this dispense event
        flowTimeSec:
          type: number
          description: Flow duration in seconds for this dispense event

    ESenseVoltageStatus:
      type: object
      properties:
        current:
          type: ["number", "null"]
        todayHigh:
          type: ["number", "null"]
        todayLow:
          type: ["number", "null"]
        todayAverage:
          type: ["number", "null"]
        trend:
          type: ["string", "null"]

    ESenseChartsData:
      type: object
      required: [tankHeight, dailyInflow, voltageHistory, flowRateHistory]
      properties:
        tankHeight:
          type: array
          items:
            $ref: "#/components/schemas/ESenseTankPoint"
        dailyInflow:
          type: array
          items:
            $ref: "#/components/schemas/ESenseInflowDay"
        voltageHistory:
          type: array
          items:
            $ref: "#/components/schemas/ESenseVoltagePoint"
        voltageStatus:
          $ref: "#/components/schemas/ESenseVoltageStatus"
        flowRateHistory:
          type: array
          items:
            $ref: "#/components/schemas/ESenseFlowRatePoint"
          description: Per-dispense flow rates decoded from 0x44 DATALOG packets (flow_time > 10 s)
        dispenseVolumes:
          $ref: "#/components/schemas/ESenseDispenseVolumes"

    ESenseDispenseVolumeBin:
      type: object
      required: [binStart, count]
      properties:
        binStart:
          type: number
          description: Lower edge of the 1 L bin (10..29)
        count:
          type: integer
          description: Number of dispenses whose volume falls in [binStart, binStart+1); the last bin (29) is inclusive of 30 L exactly

    ESenseDispenseVolumes:
      type: object
      required: [bins, sampleCount, currentLcf, currentPreload, kdePeak, measuredPreload, preloadSampleCount, suggestedLcf, v3Meter]
      properties:
        bins:
          type: array
          items:
            $ref: "#/components/schemas/ESenseDispenseVolumeBin"
          description: 1 L histogram bins from 10 to 30 L
        kdeCurve:
          type: array
          items:
            type: object
            required: [x, y]
            properties:
              x:
                type: number
              y:
                type: number
          description: Gaussian KDE evaluated on a 0.05 L grid over 10-30 L (scaled to histogram counts)
        sampleCount:
          type: integer
          description: Number of in-range (10-30 L) dispenses in the period
        currentLcf:
          type: ["number", "null"]
          description: The asset's LCF (ticks per litre); null when not configured
        currentPreload:
          type: ["number", "null"]
          description: The asset's current Preload setting (tick offset); null when not configured (treated as 0 in the correction math)
        kdePeak:
          type: ["number", "null"]
          description: Exact typical dispense volume in litres (KDE density maximum); null when sampleCount < 10
        measuredPreload:
          type: ["number", "null"]
          description: Average unmetered ticks (FC) from event-type 0x01 "no credit" DATALOG packets in the period; null when no such packets were received
        preloadSampleCount:
          type: integer
          description: Number of event-type 0x01 packets the measured preload average is based on
        suggestedLcf:
          type: ["integer", "null"]
          description: "Suggested LCF for a true 20 L typical fill: round((kdePeak x currentLcf - measuredPreload) / 20), measuredPreload null -> 0; null when kdePeak unavailable, the result is not positive, or a v3 flow meter"
        v3Meter:
          type: boolean
          description: True when the asset uses a v3 flow meter (LCF < 100, typically ~71) — calibration suggestion not applicable

    ProxyInput:
      type: object
      required: [api, path, method]
      properties:
        api:
          type: string
          description: "One of: query, state, command, auth"
        path:
          type: string
          description: "API path, e.g. /api/Tap/GetAll"
        method:
          type: string
          description: "HTTP method: GET, POST, PUT, DELETE"
        body:
          type: object
          additionalProperties: true

    ProxyResponse:
      type: object
      required: [status]
      properties:
        status:
          type: integer
        data:
          type: object
          additionalProperties: true
