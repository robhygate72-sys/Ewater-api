kind = "web"
previewPath = "/"
title = "eWater Monitor"
version = "1.0.0"
id = "artifacts/ewater-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19955

[services.development]
run = "pnpm --filter @workspace/ewater-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ewater-app", "run", "build" ]
publicDir = "artifacts/ewater-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19955"
BASE_PATH = "/"
